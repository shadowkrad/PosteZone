server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;
    index index.html index.php;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Area riservata: pannello admin e API di scrittura (utente/password da ADMIN_USER / ADMIN_PASSWORD)
    location = /admin.html {
        auth_basic "PosteZone - Area riservata";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location ~ ^/api/(admin_[a-z_]+|import|assign_zone)\.php$ {
        auth_basic "PosteZone - Area riservata";
        auth_basic_user_file /etc/nginx/.htpasswd;
        include /etc/nginx/php-fpm.conf;
    }

    # API pubbliche di sola lettura
    location ~ ^/api/(search|search_ocr|suggest)\.php$ {
        include /etc/nginx/php-fpm.conf;
    }

    # Nessun altro PHP viene eseguito o esposto (es. db.php)
    location ~ \.php$ {
        return 404;
    }

    # Database, log e file di backup non devono mai essere serviti
    location ~* \.(db|db-wal|db-shm|sqlite|log|bak|json|xlsx|csv)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
